                compHeading: "कस्टम इमेज कंप्रेसर",
                origTitle: "मूल इमेज",
                compTitle: "कंप्रेस इमेज",
                qualityLabel: "क्वालिटी: ",
                btnDownload: "डाउनलोड करें",
                btnGenQrComp: "क्यूआर कोड बनाएं",
                qrHeading: "क्यूआर जनरेटर",
                qrPlaceholder: "टेक्स्ट या URL दर्ज करें",
                qrImgLabel: "लोकल स्टोरेज से इमेज अपलोड करें:",
                txtOr: "या",
                btnGenQr: "क्यूआर जनरेट करें",
                btnDownloadQr: "क्यूआर कोड डाउनलोड करें",
                pdfHeading: "पीडीएफ जनरेटर",
                pdfPlaceholder: "पीडीएफ के लिए टेक्स्ट लिखें...",
                pdfImgLabel: "इमेज से पीडीएफ बनाएं:",
                btnGenPdf: "पीडीएफ डाउनलोड करें",
                historyHeading: "हिस्ट्री",
                btnClearHistory: "हिस्ट्री साफ करें",
                errNoQrData: "टेक्स्ट दर्ज करें या इमेज चुनें!",
                sizeTxt: "साइज: ",
                emptyHistory: "हिस्ट्री खाली है",
                imgLoadedTxt: "[इमेज QR के लिए तैयार है]"
            }
        };

        let currentLang = 'ru';
        let originalImageObject = null;
        let currentCompressedData = null;
        let currentCompressedSizeKB = 0;
        let qrImageDataUrl = null;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.title = t.title;
            document.getElementById('txt-logo').innerText = t.logo;
            document.getElementById('txt-install').innerText = t.install;
            document.getElementById('menu-compressor').innerText = t.menuComp;
            document.getElementById('menu-qr').innerText = t.menuQr;
            document.getElementById('menu-pdf').innerText = t.menuPdf;
            document.getElementById('menu-history').innerText = t.menuHistory;
            document.getElementById('txt-settings-title').innerText = t.settingsTitle;
            document.getElementById('txt-lang-label').innerText = t.langLabel;
            
            document.getElementById('txt-comp-heading').innerText = t.compHeading;
            document.getElementById('txt-orig-title').innerText = t.origTitle;
            document.getElementById('txt-comp-title').innerText = t.compTitle;
            document.getElementById('txt-quality-label').childNodes[0].nodeValue = t.qualityLabel;
            document.getElementById('btn-download').innerText = t.btnDownload;
            document.getElementById('btn-gen-qr-comp').innerText = t.btnGenQrComp;
            
            document.getElementById('txt-qr-heading').innerText = t.qrHeading;
            document.getElementById('qrInput').placeholder = t.qrPlaceholder;
            document.getElementById('txt-or').innerText = t.txtOr;
            document.getElementById('txt-qr-img-label').innerText = t.qrImgLabel;
            document.getElementById('btn-gen-qr').innerText = t.btnGenQr;
            document.getElementById('btn-download-qr').innerText = t.btnDownloadQr;
            
            document.getElementById('txt-pdf-heading').innerText = t.pdfHeading;
            document.getElementById('pdfText').placeholder = t.pdfPlaceholder;
            document.getElementById('txt-or-pdf').innerText = t.txtOr;
            document.getElementById('txt-pdf-img-label').innerText = t.pdfImgLabel;
            document.getElementById('btn-gen-pdf').innerText = t.btnGenPdf;
            
            document.getElementById('txt-history-heading').innerText = t.historyHeading;
            document.getElementById('btn-clear-history').innerText = t.btnClearHistory;

            if(document.getElementById('history').classList.contains('active')) loadHistory();
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('settings-modal').classList.remove('active');
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('sidebar').classList.remove('active');
        }

        function closeAllPanels() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('settings-modal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            closeAllPanels();
            if(tabId === 'history') loadHistory();
        }

        function installApp() {
            alert('App Installation Started!');
        }

        /* Image Compression Logic */
        function handleImageUpload(input) {
            const file = input.files[0];
            const t = translations[currentLang];
            if (!file) return;

            const origSizeKB = (file.size / 1024).toFixed(2);
            document.getElementById('origSizeInfo').innerText = `${t.sizeTxt}${origSizeKB} KB`;
            document.getElementById('downloadFileName').value = file.name.split('.')[0] + '_compressed';

            const reader = new FileReader();
            reader.onload = function(e) {
                originalImageObject = new Image();
                originalImageObject.src = e.target.result;
                originalImageObject.onload = function() {
                    document.getElementById('originalImg').src = e.target.result;
                    document.getElementById('originalCard').style.display = 'block';
                    compressImage();
                }
            };
            reader.readAsDataURL(file);
        }

        function updateQualityVal(val) {
            document.getElementById('qualityVal').innerText = val;
            if (originalImageObject) compressImage();
        }

        function compressImage() {
            if (!originalImageObject) return;
            const t = translations[currentLang];
            const quality = parseInt(document.getElementById('qualitySlider').value) / 100;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = originalImageObject.width;
            canvas.height = originalImageObject.height;
            ctx.drawImage(originalImageObject, 0, 0);

            const format = document.getElementById('downloadFormat').value;
            const dataUrl = canvas.toDataURL(format, quality);
            
            const head = format === 'image/png' ? 'data:image/png;base64,' : 'data:image/jpeg;base64,';
            const sizeInBytes = Math.round((dataUrl.length - head.length) * 3 / 4);
            currentCompressedSizeKB = (sizeInBytes / 1024).toFixed(2);
            currentCompressedData = dataUrl;

            document.getElementById('compressedImg').src = dataUrl;
            document.getElementById('compSizeInfo').innerText = `${t.sizeTxt}${currentCompressedSizeKB} KB`;
            document.getElementById('compressedCard').style.display = 'block';
        }

        function downloadCompressedImage() {
            if (!currentCompressedData) return;
            const fileName = document.getElementById('downloadFileName').value || 'image';
            const formatSelect = document.getElementById('downloadFormat').value;
            const ext = formatSelect === 'image/png' ? '.png' : '.jpg';

            const link = document.createElement('a');
            link.href = currentCompressedData;
            link.download = fileName + ext;
            link.click();

            const t = translations[currentLang];
            saveToHistory({ type: t.compHeading, data: currentCompressedData, size: currentCompressedSizeKB + ' KB' });
        }

        /* Image Optimization for QR Storage */
        function optimizeForQR(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 40;
                canvas.height = 40;
                ctx.drawImage(img, 0, 0, 40, 40);
                callback(canvas.toDataURL('image/jpeg', 0.2));
            };
            img.src = dataUrl;
        }

        function handleQrImageUpload(input) {
            const file = input.files[0];
            const t = translations[currentLang];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                optimizeForQR(e.target.result, function(optimizedData) {
                    qrImageDataUrl = optimizedData;
                    document.getElementById('qrInput').value = t.imgLoadedTxt;
                });
            };
            reader.readAsDataURL(file);
        }

        function triggerQrFromComp() {
            const t = translations[currentLang];
            switchTab('qr');
            document.getElementById('qrInput').value = t.imgLoadedTxt;
            optimizeForQR(currentCompressedData, function(optimizedData) {
                qrImageDataUrl = optimizedData;
                generateQR();
            });
        }

        /* QR Generator */
        function generateQR() {
            const textInput = document.getElementById('qrInput').value;
            const qrContainer = document.getElementById('qrcode');
            const qrResult = document.getElementById('qrResult');
            const qrBgBox = document.getElementById('qrBgBox');
            const t = translations[currentLang];
            qrContainer.innerHTML = '';

            let finalData = "";
            let isImageMode = false;

            if (textInput === t.imgLoadedTxt && qrImageDataUrl) {
                finalData = qrImageDataUrl;
                isImageMode = true;
                qrBgBox.style.backgroundImage = `url('${qrImageDataUrl}')`;
            } else if (textInput) {
                finalData = textInput;
                qrBgBox.style.backgroundImage = `none`;
                qrBgBox.style.background = `rgba(0,0,0,0.05)`;
            } else {
                alert(t.errNoQrData);
                return;
            }

            new QRCode(qrContainer, {
                text: finalData,
                width: 160,
                height: 160,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });
            
            qrResult.style.display = 'block';
            
            const historyObj = { type: t.qrHeading };
            if(isImageMode) {
                historyObj.data = finalData;
                historyObj.size = "Image QR Code";
            } else {
                historyObj.text = finalData.substring(0, 30) + '...';
            }
            saveToHistory(historyObj);
        }

        /* Download QR Code */
        function downloadQRCode() {
            const qrContainer = document.getElementById('qrcode');
            const img = qrContainer.querySelector('img');
            const canvas = qrContainer.querySelector('canvas');
            
            let downloadUrl = "";
            if (img && img.src) {
                downloadUrl = img.src;
            } else if (canvas) {
                downloadUrl = canvas.toDataURL('image/png');
            }

            if (!downloadUrl) return;

            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'qrcode.png';
            link.click();
        }

        /* PDF Generator */
        async function generatePDF() {
            const text = document.getElementById('pdfText').value;
            const imageInput = document.getElementById('pdfImageUpload');
            const files = imageInput.files;
            const t = translations[currentLang];

            if (!text && files.length === 0) {
                alert(t.errNoQrData);
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            if (text) {
                doc.text(text, 10, 10);
            }

            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const dataUrl = await new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });

                    if (text || i > 0) doc.addPage();
                    doc.addImage(dataUrl, 'JPEG', 15, 15, 180, 160);
                }
            }

            doc.save("document.pdf");
            saveToHistory({ type: t.pdfHeading, text: text ? text.substring(0, 30) + '...' : 'Image PDF' });
        }

        /* History Storage */
        function saveToHistory(item) {
            let history = JSON.parse(localStorage.getItem('app_history') || '[]');
            item.date = new Date().toLocaleTimeString();
            history.unshift(item);
            localStorage.setItem('app_history', JSON.stringify(history));
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            const t = translations[currentLang];
            let history = JSON.parse(localStorage.getItem('app_history') || '[]');
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = `<p>${t.emptyHistory}</p>`;
                return;
            }

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                if(item.data) {
                    div.innerHTML = `<strong>[${item.date}] ${item.type}</strong><br><img src="${item.data}"><br>${item.size || ''}`;
                } else {
                    div.innerHTML = `<strong>[${item.date}] ${item.type}</strong><br><p>${item.text}</p>`;
                }
                historyList.appendChild(div);
            });
        }

        function clearHistory() {
            localStorage.removeItem('app_history');
            loadHistory();
        }
    </script>
</body>
</html>
